services:
  mysql:
    image: 'mysql:8.4'
    environment:
      MYSQL_DATABASE: docucore
      MYSQL_USER: myuser
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_NAME: docucore
      DB_USER: myuser
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - mysql